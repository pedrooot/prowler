name: prowler-go

on:
  push:
    branches: [master]
    paths: ["prowler-go/**", ".github/workflows/go-build.yml"]
  pull_request:
    paths: ["prowler-go/**", ".github/workflows/go-build.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prowler-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: prowler-go/go.mod
          cache-dependency-path: prowler-go/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Verify generated code is up to date
        run: |
          go run ./internal/codegen
          git diff --exit-code -- pkg/provider pkg/compliance/frameworks
